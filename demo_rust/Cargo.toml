[package]
name = "campus-qa"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "accesskit", "default_fonts", "links", "wayland", "x11"] }
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita", "wayland-dlopen"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 0

[profile.release]
strip = true
