# Public parameter template; prepare_local.py writes private runtime paths.
model_name_or_path: MODEL_PATH_SET_BY_PREPARE
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
quantization_method: bnb
quantization_bit: 4
quantization_type: nf4
double_quantization: true
lora_target: all
lora_rank: 4
lora_alpha: 8
lora_dropout: 0.05
dataset: campus_train
eval_dataset: campus_val
dataset_dir: data/synthetic
template: qwen
cutoff_len: 512
preprocessing_num_workers: 1
output_dir: runs/runtime/Q4
overwrite_output_dir: false
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 0.0001
lr_scheduler_type: cosine
warmup_ratio: 0.05
optim: adamw_torch
fp16: false
bf16: true
seed: 42
data_seed: 42
logging_steps: 10
save_strategy: 'no'
eval_strategy: epoch
load_best_model_at_end: false
predict_with_generate: false
report_to: none
dataloader_num_workers: 0
dataloader_pin_memory: false
flash_attn: sdpa
use_reentrant_gc: false
upcast_layernorm: true
disable_tqdm: true
plot_loss: false
num_train_epochs: 2.0
save_total_limit: 2
save_only_model: true
train_on_prompt: false
packing: false
overwrite_cache: false
resume_from_checkpoint: null
